# ============================================================
# 融合玩法库 —— 可嫁接到任意核心玩法的「机制大全」
#
# 这是需求①「方案方向尽量多」的基石：一份机制清单，自动 × 核心玩法
# 生成所有候选方向。每个条目只描述「机制本身」，不绑定具体核心玩法。
#
# 字段说明：
#   id                机制唯一 id（展开后作为 fusion id）
#   name              中文机制名
#   category_id       Sensor Tower 品类 id（决定「空间」维度天花板）
#   st_subgenre       ST 子品类名（用于展示 + 搜索兜底）
#   fusion_role      与核心玩法融合时的默认角色（副玩法/外壳/养成层/核心替换）
#   benchmark_keywords 用于 ST 搜索「该机制的真实标杆游戏」的关键词（中英文都给）
#   exemplars         搜索时作为种子的真实游戏名（提高搜索命中率；可留空）
#
# ST 品类 id 速查：Action=7001 / Adventure=7002 / Card=7005 /
#                  Puzzle=7012 / Role Playing=7014 / Simulation=7015 / Strategy=7017
# ============================================================

library:
