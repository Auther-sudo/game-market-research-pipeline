  payment:
    metric: seed_rpd
    anchors:
    - - 0.5
      - 2
    - - 2.0
      - 4
    - - 6.0
      - 6
    - - 15.0
      - 8
    - - 40.0
      - 10
risk:
  no_seed_penalty: 12
  low_overlap_threshold: 0.25
  low_overlap_penalty: 10
  max_risk: 30
